<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07111f,#0b1b2e 55%,#102b3d);color:#eef7f7;font-family:Arial,sans-serif;padding:20px}
    .wrap{width:100%;max-width:430px}
    .brand{text-align:center;margin-bottom:22px}
    .logo{width:62px;height:62px;margin:auto;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#79f2c0,#4db5ff);color:#06121d;font-size:22px;font-weight:800;box-shadow:0 10px 35px rgba(77,181,255,.22)}
    h1{margin:14px 0 5px;font-size:29px}.sub{margin:0;color:#9eb0bf}
    .card{background:rgba(15,29,45,.88);border:1px solid rgba(143,181,205,.18);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 8px;color:#cbd9e2}
    .field{margin-bottom:17px}input{width:100%;padding:13px 14px;border:1px solid #30465a;border-radius:12px;background:#091827;color:#fff;outline:none;font-size:15px}input:focus{border-color:#66d9ff;box-shadow:0 0 0 3px rgba(102,217,255,.1)}
    .row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 17px;font-size:13px;color:#9eb0bf}.remember{display:flex;gap:7px;align-items:center}.remember input{width:auto}
    .btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#79f2c0,#4db5ff);color:#06121d}.google{background:#fff;color:#1f2937;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.google-icon{font-weight:900;font-size:18px}.or{display:flex;align-items:center;gap:10px;color:#718496;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";height:1px;background:#263a4c;flex:1}
    .error{margin-bottom:16px;padding:11px 12px;border-radius:10px;background:#3a1719;border:1px solid #6e292c;color:#ffb5b5;font-size:13px}.demo{margin-top:18px;padding:12px;border-radius:11px;background:#0a1a29;color:#8298aa;font-size:12px;text-align:center}.demo strong{color:#d9e7ef}
    .footer{text-align:center;color:#657b8e;font-size:11px;margin-top:16px}

    body{background:linear-gradient(145deg,#111417 0%,#171b1e 52%,#222326 100%);color:#f6f0e7;font-family:'DM Sans',sans-serif}
    .wrap{max-width:450px}
    .brand{margin-bottom:28px}
    .logo{width:64px;height:64px;border-radius:16px;background:#e8b267;color:#17120d;box-shadow:0 12px 30px rgba(232,178,103,.2);font-family:'Space Grotesk',sans-serif}
    h1{font-family:'Space Grotesk',sans-serif;font-size:30px;letter-spacing:-.02em}
    .sub{color:#a9aaa5}
    .card{background:rgba(29,33,37,.94);border:1px solid rgba(246,240,231,.13);border-radius:16px;padding:30px;box-shadow:0 22px 50px rgba(0,0,0,.28)}
    label{color:#d8d2c8;font-family:'DM Sans',sans-serif}
    input{border-color:rgba(246,240,231,.16);border-radius:10px;background:#111417;color:#f6f0e7;font-family:'DM Sans',sans-serif}
    input:focus{border-color:#e8b267;box-shadow:0 0 0 3px rgba(232,178,103,.12)}
    .row{color:#a9aaa5}
    .btn{border-radius:10px;font-family:'DM Sans',sans-serif}
    .primary{background:#e8b267;color:#17120d}
    .google{background:#f6f0e7;color:#17120d}
    .or{color:#8c8c87}.or:before,.or:after{background:rgba(246,240,231,.13)}
    .demo{background:rgba(232,178,103,.08);color:#a9aaa5}.demo strong{color:#f6f0e7}
    .footer{color:#858681}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">SI</div>
    <h1>Smart Inventory</h1>
    <p class="sub">Sign in to continue</p>
  </div>

  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="field">
        <label for="username">Username / Email / Mobile</label>
        <input id="username" name="username" type="text" placeholder="Enter username, email or mobile" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <span>Secure login</span>
      </div>

      <button class="btn primary" type="submit">Sign in</button>
    </form>

    <div class="or"><span>OR</span></div>

    <button class="btn google" type="button" onclick="window.location.href='{{ url_for('google_login') }}'">
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <div class="demo">Local demo: <strong>admin</strong> / <strong>admin123</strong></div>
  </div>

  <div class="footer">Privacy-first retail intelligence · Smart Inventory</div>
</div>
</body>
</html>
